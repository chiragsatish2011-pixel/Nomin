<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nomin Code</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Applied before first paint so a hard refresh never flashes the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem("nomin.theme");
          var dark = stored ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The official Nomin logo, placed exactly as supplied. favicon.png is
         that same artwork composited on the brand tile so the white glyph
         stays visible on a light tab strip; nothing here is redrawn. -->
    <link rel="icon" href="/favicon.png" type="image/png" sizes="256x256" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#7132f5" />
    <meta name="description" content="An autonomous engineering workspace." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
